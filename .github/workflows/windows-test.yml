name: Windows Test

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run ID of Windows Build workflow"
        required: true
  workflow_run:
    workflows: ["Windows Build"]
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  test-windows:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.run_id }}

      - name: Install Windows installer silently
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\ThKioskHelperInstaller.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/LOG=setup.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Write-Error "Installer failed with exit code $($p.ExitCode)"
            if (Test-Path setup.log) { Get-Content setup.log }
            exit 1
          }

      - name: Verify installation location
        shell: pwsh
        run: |
          $regKeys = @(
            "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\ThKiosk Helper_is1",
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\ThKiosk Helper_is1",
            "HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\ThKiosk Helper_is1"
          )

          $installDir = $null
          foreach ($k in $regKeys) {
            if (Test-Path $k) {
              $props = Get-ItemProperty -Path $k
              if ($props."Inno Setup: App Path") {
                $installDir = $props."Inno Setup: App Path"
                break
              }
              if ($props.InstallLocation) {
                $installDir = $props.InstallLocation
                break
              }
            }
          }

          if ($installDir) {
            Write-Host "Installer registry location: $installDir"
          } else {
            Write-Warning "Installer registry location not found; falling back to filesystem search"
          }

      - name: Run helper in background
        shell: pwsh
        run: |
          $regKeys = @(
            "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\ThKiosk Helper_is1",
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\ThKiosk Helper_is1",
            "HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\ThKiosk Helper_is1"
          )

          $registryCandidate = $null
          foreach ($k in $regKeys) {
            if (Test-Path $k) {
              $props = Get-ItemProperty -Path $k
              $appPath = $props."Inno Setup: App Path"
              if ($appPath) {
                $candidate = Join-Path $appPath "thkiosk-helper.exe"
                if (Test-Path $candidate) {
                  $registryCandidate = $candidate
                  break
                }
              }
            }
          }

          $candidates = @(
            $registryCandidate,
            "C:\Program Files\ThKiosk Helper\thkiosk-helper.exe",
            "C:\Program Files (x86)\ThKiosk Helper\thkiosk-helper.exe"
          ) | Where-Object { $_ }

          $exe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) {
            $exe = Get-ChildItem -Path "C:\Program Files", "C:\Program Files (x86)" -Filter "thkiosk-helper.exe" -File -Recurse -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName -First 1
          }

          if (-not $exe) {
            Write-Host "Install candidates checked:"
            $candidates | ForEach-Object { Write-Host " - $_" }
            if (Test-Path setup.log) {
              Write-Host "----- setup.log -----"
              Get-Content setup.log
            }
            Write-Error "Installed helper executable not found in Program Files locations"
            exit 1
          }

          Write-Host "Using helper executable: $exe"

          $proc = Start-Process -FilePath $exe -WorkingDirectory $env:GITHUB_WORKSPACE -RedirectStandardOutput helper.log -RedirectStandardError helper.err -PassThru
          Set-Content -Path helper.pid -Value $proc.Id
          Start-Sleep -Seconds 2

          if ($proc.HasExited) {
            Write-Error "Helper exited immediately with code $($proc.ExitCode)"
            if (Test-Path helper.log) { Get-Content helper.log }
            if (Test-Path helper.err) { Get-Content helper.err }
            if (Test-Path "$env:USERPROFILE\\.thkiosk-helper.log") { Get-Content "$env:USERPROFILE\\.thkiosk-helper.log" }
            exit 1
          }

          $healthy = $false
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $response = Invoke-WebRequest -Uri "http://localhost:3333/health" -TimeoutSec 2
              if ($response.StatusCode -eq 200) {
                $healthy = $true
                break
              }
            }
            catch {
              Start-Sleep -Seconds 1
            }
          }

          if (-not $healthy) {
            Write-Error "Helper did not become healthy in time"
            if (Test-Path helper.pid) {
              $helperPid = Get-Content helper.pid
              Get-Process -Id $helperPid -ErrorAction SilentlyContinue | Format-Table Id, ProcessName, StartTime
            }
            if (Test-Path helper.log) { Get-Content helper.log }
            if (Test-Path helper.err) { Get-Content helper.err }
            if (Test-Path "$env:USERPROFILE\\.thkiosk-helper.log") { Get-Content "$env:USERPROFILE\\.thkiosk-helper.log" }
            exit 1
          }

      - name: Test /health endpoint
        shell: pwsh
        run: |
          $response = Invoke-RestMethod -Uri "http://localhost:3333/health" -Method GET -TimeoutSec 10
          if ($response.status -ne "alive") {
            Write-Error "Unexpected /health response: $($response | ConvertTo-Json -Compress)"
            exit 1
          }

      - name: Test /open-browser endpoint
        shell: pwsh
        run: |
          $body = @{ target_url = "https://example.com"; browser = "edge"; kiosk = $false } | ConvertTo-Json -Compress
          $response = Invoke-RestMethod -Uri "http://localhost:3333/open-browser" -Method POST -ContentType "application/json" -Body $body -TimeoutSec 10
          if ($response.status -ne "ok") {
            Write-Error "Unexpected /open-browser response: $($response | ConvertTo-Json -Compress)"
            exit 1
          }

      - name: Show helper logs
        if: always()
        shell: pwsh
        run: |
          if (Test-Path helper.log) { Get-Content helper.log }
          if (Test-Path helper.err) { Get-Content helper.err }

      - name: Stop helper process
        if: always()
        shell: pwsh
        run: |
          if (Test-Path helper.pid) {
            $helperPid = Get-Content helper.pid
            Stop-Process -Id $helperPid -Force -ErrorAction SilentlyContinue
          }
          Get-Process -Name "thkiosk-helper" -ErrorAction SilentlyContinue | Stop-Process -Force