name: Linux Build

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Install build dependencies
        run: pip install -r build-requirements.txt

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Linux binary
        run: |
          pyinstaller --onefile --name thkiosk-helper src/main.py
          mkdir -p dist/linux
          cp dist/thkiosk-helper build/linux/debian/usr/local/bin/thkiosk-helper
          chmod 755 build/linux/debian/DEBIAN/postinst
          dpkg-deb --build build/linux/debian dist/linux/thkiosk-helper_1.0.0_amd64.deb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          # name: thkiosk-helper-linux
          name: linux-installer
          path: dist/linux/thkiosk-helper_1.0.0_amd64.deb
