name: Linux Test

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run ID of Linux Build workflow"
        required: true
  workflow_run:
    workflows: ["Linux Build"]
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  test-linux:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-20.04

    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-installer
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.run_id }}

      - name: Install .deb
        run: |
          sudo dpkg -i thkiosk-helper_1.0.0_amd64.deb || true
          sudo apt --fix-broken install -y

      - name: Create fake browser executable
        run: |
          echo '#!/bin/bash' | sudo tee /usr/local/bin/google-chrome
          echo 'echo "FAKE BROWSER LAUNCHED: $@"' | sudo tee -a /usr/local/bin/google-chrome
          sudo chmod +x /usr/local/bin/google-chrome

      - name: Run helper in background
        run: |
          nohup thkiosk-helper > helper.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS --max-time 2 http://localhost:3333/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Helper did not become healthy in time"
          cat helper.log || true
          exit 1

      - name: Test /health endpoint
        run: |
          curl -fsS --max-time 10 http://localhost:3333/health

      - name: Test /open-browser endpoint
        run: |
          curl -fsS --max-time 10 -X POST http://localhost:3333/open-browser \
            -H "Content-Type: application/json" \
            -d '{"target_url":"https://example.com","browser":"google-chrome","kiosk":false}'

      - name: Show helper log
        run: |
          cat helper.log